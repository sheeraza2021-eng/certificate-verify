<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1f33;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(212,175,55,0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(212,175,55,0.08), transparent 40%);
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            padding: 14px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            overflow: hidden;
            border: 1px solid #e7dcc2;
            display: flex;
            flex-direction: column;
        }

        .gold-strip {
            height: 5px;
            background: linear-gradient(90deg, #b8860b, #e6c65c, #b8860b);
            flex-shrink: 0;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 16px;
            gap: 8px;
            border-bottom: 1px solid #f0ead9;
            flex-shrink: 0;
        }

        .header-row h1 {
            flex: 1;
            margin: 0;
            color: #0b1f33;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .logo {
            max-height: 40px;
            width: auto;
            object-fit: contain;
        }

        .seal-zone {
            text-align: center;
            padding: 20px 18px 8px;
            flex-shrink: 0;
        }

        .seal {
            width: 68px;
            height: 68px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .seal.verified {
            background: radial-gradient(circle at 35% 30%, #a8e6b0, #2e9e4f 55%, #1e6d38 100%);
            box-shadow: 0 6px 16px rgba(30,109,56,0.4), inset 0 0 0 4px #eafcee;
        }

        .seal.not-verified {
            background: radial-gradient(circle at 35% 30%, #f7b3b3, #d9534f 55%, #a83a37 100%);
            box-shadow: 0 6px 16px rgba(169,58,55,0.35), inset 0 0 0 4px #fff0f0;
        }

        .seal.checking {
            background: radial-gradient(circle at 35% 30%, #fdeec0, #e6b325 55%, #b5860f 100%);
            box-shadow: 0 6px 16px rgba(181,134,15,0.3), inset 0 0 0 4px #fffbe8;
        }

        .seal svg { width: 32px; height: 32px; }

        .badge-label {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin: 0 0 3px;
        }

        .badge-label.verified { color: #1e6d38; }
        .badge-label.not-verified { color: #a83a37; }
        .badge-label.checking { color: #b5860f; }

        .badge-sub {
            font-size: 12px;
            color: #8a8f98;
            margin: 0 0 14px;
        }

        .details {
            padding: 4px 20px 14px;
            text-align: left;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px dashed #e7dcc2;
        }

        .row:last-child { border-bottom: none; }

        .label {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #a9821f;
            white-space: nowrap;
        }

        .value {
            color: #1f2937;
            font-size: 13.5px;
            font-weight: 500;
            text-align: right;
            max-width: 62%;
            word-wrap: break-word;
        }

        footer {
            padding: 10px 20px;
            background: #faf7ee;
            border-top: 1px solid #f0ead9;
            font-size: 10.5px;
            color: #9a8f6d;
            text-align: center;
            flex-shrink: 0;
        }

        @media (max-height: 620px) {
            .header-row { padding: 12px 18px 10px; }
            .header-row h1 { font-size: 15px; }
            .logo { max-height: 30px; }
            .seal-zone { padding: 10px 18px 6px; }
            .seal { width: 50px; height: 50px; }
            .seal svg { width: 24px; height: 24px; }
            .row { padding: 6px 0; }
        }

        @media (max-width: 380px) {
            .card { max-width: 100%; }
            .header-row h1 { font-size: 14px; }
        }
    </style>
</head>

<body>

<div class="card">
    <div class="gold-strip"></div>
    <div class="header-row">
        <img src="https://i.postimg.cc/hjDBYBFW/MAJU-LOGO-PNG.png" alt="MAJU Logo" class="logo">
        <h1>Certificate Verification</h1>
        <img src="https://image2url.com/r2/default/images/1768464173489-b76e6ebe-4356-40bb-86f2-80d601a63481.png" alt="QEC Logo" class="logo">
    </div>

    <div class="seal-zone">
        <div id="seal" class="seal not-verified">
            <svg id="sealIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
        </div>
        <p id="badgeLabel" class="badge-label not-verified">Not Verified</p>
        <p class="badge-sub">Official certificate scan result</p>
    </div>

    <div class="details">
        <div class="row">
            <div class="label">Certificate No</div>
            <div class="value" id="certNo">—</div>
        </div>
        <div class="row">
            <div class="label">Name</div>
            <div class="value" id="name">—</div>
        </div>
        <div class="row">
            <div class="label">Designation</div>
            <div class="value" id="designation">—</div>
        </div>
        <div class="row">
            <div class="label">Training Name</div>
            <div class="value" id="trainingName">—</div>
        </div>
        <div class="row">
            <div class="label">Held On</div>
            <div class="value" id="heldOn">—</div>
        </div>
        <div class="row">
            <div class="label">Organized By</div>
            <div class="value" id="organizedBy">—</div>
        </div>
        <div class="row">
            <div class="label">Trainer Name</div>
            <div class="value" id="trainerName">—</div>
        </div>
        <div class="row">
            <div class="label">Date of Issue</div>
            <div class="value" id="date">—</div>
        </div>
    </div>

    <footer>
        This certificate is issued by the QEC Department, Mohammad Ali Jinnah University, Karachi.
    </footer>
</div>

<script>
window.onload = async function () {
    const params = new URLSearchParams(window.location.search);
    const certNo = params.get('certNo');

    const seal = document.getElementById('seal');
    const sealIcon = document.getElementById('sealIcon');
    const badgeLabel = document.getElementById('badgeLabel');

    const fields = {
        cert: document.getElementById('certNo'),
        name: document.getElementById('name'),
        designation: document.getElementById('designation'),
        trainingName: document.getElementById('trainingName'),
        heldOn: document.getElementById('heldOn'),
        organizedBy: document.getElementById('organizedBy'),
        trainerName: document.getElementById('trainerName'),
        date: document.getElementById('date')
    };

    const icons = {
        verified: '<path d="M5 12.5L10 17L19 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
        'not-verified': '<path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
        checking: '<circle cx="12" cy="12" r="3" fill="#fff"/>'
    };

    function setStatus(state, label) {
        seal.className = 'seal ' + state;
        badgeLabel.className = 'badge-label ' + state;
        badgeLabel.textContent = label;
        sealIcon.innerHTML = icons[state];
    }

    function setNotFound() {
        Object.values(fields).forEach(el => { if (el !== fields.cert) el.textContent = 'Not Found'; });
        setStatus('not-verified', 'Not Verified');
    }

    if (!certNo) {
        fields.cert.textContent = 'Not Found';
        setNotFound();
        return;
    }

    setStatus('checking', 'Checking...');

    const flowUrl = 'https://default12b221b30464422389e5888835778b.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9cd32f7a18e142a88aa109008eb515e7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=zZPcMCkklDO6pl-qIDPfZVQ3h32d0vEA01VkYNKI4Io';

    try {
        const res = await fetch(flowUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ certNo })
        });
        const data = await res.json();

        if (data.Message === 'No') {
            fields.cert.textContent = certNo;
            setNotFound();
        } else {
            fields.cert.textContent = data['Certificate No'];
            fields.name.textContent = data['Name'];
            fields.designation.textContent = data['Designation'];
            fields.trainingName.textContent = data['Training Name'] || 'Not Found';
            fields.heldOn.textContent = data['Held on'] || 'Not Found';
            fields.organizedBy.textContent = data['Organized by'] || 'Not Found';
            fields.trainerName.textContent = data['Trainer Name'] || 'Not Found';
            fields.date.textContent = data['Date of Issue'];

            if (data['Name'] && data['Date of Issue']) {
                setStatus('verified', 'Verified');
            } else {
                setStatus('not-verified', 'Not Verified');
            }
        }
    } catch (e) {
        console.error('Verification error:', e);
        fields.cert.textContent = certNo || 'Not Found';
        setNotFound();
        fields.name.textContent = 'Error';
        fields.designation.textContent = 'Error';
        fields.trainingName.textContent = 'Error';
        fields.heldOn.textContent = 'Error';
        fields.organizedBy.textContent = 'Error';
        fields.trainerName.textContent = 'Error';
        fields.date.textContent = 'Error';
    }
};
</script>

</body>
</html>
